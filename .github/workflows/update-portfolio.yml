name: Update portfolio

on:
  schedule:
    # 매주 화~토 06:30 KST(=월~금 21:30 UTC) — 미국 정규장 마감 후
    - cron: '30 21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/update_portfolio.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/portfolio.json data/portfolio_history.json
          git diff --cached --quiet || git commit -m "portfolio: 시세 자동 갱신 $(date -u +%F)"
          git push
